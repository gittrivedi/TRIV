<!DOCTYPE html>
<html>
<head>
    <title>Red Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }

        button {
            background: red;
            color: white;
            border: none;
            padding: 30px 60px;
            font-size: 30px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }

        #message {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <button onclick="showMessage()">PRESS ME</button>

    <div id="message"></div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "🎉 Button Pressed!";
        }
    </script>

</body>
</html>
